<section class="main-banner" style="display: flex; justify-content: center; background: none;">

    <div class="banner-text" style="width: 100%; max-width: 600px; margin: 0 auto;">

        <h1 style="text-align: center;">Send a Message</h1>

        <form action="mailto:ggutie51@asu.edu" method="post" enctype="text/plain"
              style="display: flex; flex-direction: column; gap: 15px; padding: 10px;">

            <div>
                <label style="display: block; margin-bottom: 5px;">
                    Your Name:
                </label>

                <input type="text" name="name" placeholder="Enter your name" required
                       style="width: 100%; padding: 10px; box-sizing: border-box;">
            </div>

            <div>
                <label style="display: block; margin-bottom: 5px;">
                    Email Address:
                </label>

                <input type="email" name="email" placeholder="Enter your email" required
                       style="width: 100%; padding: 10px; box-sizing: border-box;">
            </div>

            <div>
                <label style="display: block; margin-bottom: 5px;">
                    Your Message:
                </label>

                <textarea name="message"
                          placeholder="Write your questions or comments here..."
                          rows="6" required
                          style="width: 100%; padding: 10px; box-sizing: border-box;"></textarea>
            </div>

            <div style="text-align: center; margin-top: 10px;">
                <button type="submit" class="action-btn"
                        style="padding: 12px 25px; background: #333; color: white; border: none; cursor: pointer;">
                    Send Message
                </button>
            </div>

        </form>

    </div>

</section>
